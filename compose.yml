version: "3"

services:
  webserver:
    # https://hub.docker.com/_/php
    image: mrmoonshine/fancy-directory-index
    build: ./
    hostname: fancy-directory-index
    ports:
      - 8080:80
      - 8443:443
    restart: unless-stopped
    volumes:
       - ./:/data/www/fancy-directory-index/
       - ./testing/meta.d:/data/www/fancy-directory-index/settings/data/
       - ./testing/data.d:/var/www/html/
      #- ./logs/:/var/logs/apache/ # Doesn't work
